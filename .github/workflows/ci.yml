name: CI — build and smoke tests

# Distinct de release.yml : ce workflow ne publie jamais sur GHCR, il ne
# fait que valider le build et le comportement de l'image sur chaque push
# et chaque pull request. Seul release.yml, déclenché exclusivement par un
# tag SemVer, publie sur GHCR (voir docs/release-and-rollback.md).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Build and run fast test scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (lecture seule, pour tirer grav-runtime)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: sh tests/test-build.sh

      - name: Startup, healthy, HTTP 200
        run: sh tests/test-startup.sh

      - name: Application presence (theme, plugins, seed, assets)
        run: sh tests/test-app-presence.sh

      - name: Secrets handling and absence of committed secrets
        run: sh tests/test-secrets.sh

      # test-persistence.sh et test-update-rollback.sh restent documentés
      # et exécutables localement (docs/testing.md) : scénarios à deux temps
      # plus longs, non bloquants pour ce workflow.
